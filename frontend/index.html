<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SUMIND-IQ — Enterprise AI Knowledge Management Platform with Grounded RAG, Verifiable Citations, and Role-Based Access Governance."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230f172a'/%3E%3Cstop offset='.55' stop-color='%231e3a8a'/%3E%3Cstop offset='1' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M32 14l14 5v10c0 9.4-5.9 17.6-14 21-8.1-3.4-14-11.6-14-21V19l14-5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>SUMIND-IQ — Enterprise AI Knowledge Management Platform</title>
    <script>
      // Apply the persisted theme before first paint to avoid a dark-mode flash.
      (function () {
        try {
          if (localStorage.getItem('sumindiq_theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; padding: 3rem; text-align: center">
        <h1>SUMIND-IQ requires JavaScript</h1>
        <p>This workspace is a client-side application. Please enable JavaScript to continue.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
