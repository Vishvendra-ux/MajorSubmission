[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumind-iq-backend"
version = "1.0.0"
description = "SUMIND-IQ — Secure AI-Powered Organisational Knowledge Management Platform Backend"
readme = "../README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "eval-type-backport==0.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",
    "pgvector==0.3.6",
    "pymongo==4.9.2",
    "redis==5.2.0",
    "celery==5.4.0",
    "argon2-cffi==23.1.0",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
    "python-multipart==0.0.19",
    "httpx==0.28.1",
    "PyMuPDF==1.24.14",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "pytesseract==0.3.13",
    "Pillow==11.0.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP006", "UP035", "UP037"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]
