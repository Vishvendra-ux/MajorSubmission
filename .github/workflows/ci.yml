name: SUMIND-IQ Full-Stack CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Quality, Migrations & Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sumindiq
          POSTGRES_PASSWORD: sumindiq_ci_password
          POSTGRES_DB: sumindiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system OCR & PostgreSQL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpq-dev

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linter
        working-directory: backend
        run: ruff check app tests

      - name: Run Mypy static type checker
        working-directory: backend
        run: mypy --config-file pyproject.toml app

      - name: Run Alembic database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run Pytest suite
        working-directory: backend
        run: pytest tests -v

  frontend-ci:
    name: Frontend TypeScript, Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit & component tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend bundle
        working-directory: frontend
        run: npm run build

