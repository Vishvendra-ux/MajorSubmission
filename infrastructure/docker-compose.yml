version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sumindiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sumindiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sumindiq_secure_pw}
      POSTGRES_DB: ${POSTGRES_DB:-sumindiq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sumindiq} -d ${POSTGRES_DB:-sumindiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: sumindiq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: sumindiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sumindiq-backend
    restart: unless-stopped
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sumindiq}:${POSTGRES_PASSWORD:-sumindiq_secure_pw}@postgres:5432/${POSTGRES_DB:-sumindiq}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: sumindiq_docs
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sumindiq-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sumindiq}:${POSTGRES_PASSWORD:-sumindiq_secure_pw}@postgres:5432/${POSTGRES_DB:-sumindiq}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: sumindiq_docs
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sumindiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  uploads_data:

