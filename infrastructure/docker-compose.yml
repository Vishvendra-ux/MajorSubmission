version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: sumindiq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: sumindiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sumindiq-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: sumindiq_db
      REDIS_URL: redis://redis:6379/0
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sumind-iq-documents}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/documents
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sumindiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  uploads_data:
